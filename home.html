<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Dia — To-Do</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS principal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-root flex">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand-row mb-6">
        <div class="brand">To-Do</div>
      </div>

      <nav class="nav mt-6">
        <a href="home.html" class="nav-item active">🏠 Meu Dia</a>
        <a href="#" class="nav-item">📝 Tarefas</a>
        <a href="#" class="nav-item">⭐ Importante</a>
        <a href="#" class="nav-item">✅ Concluídas</a>
        <a href="task.html" class="nav-item">✏️ Exemplo tarefa</a>
      </nav>
    </aside>

    <!-- Conteúdo principal -->
    <main class="main">
      <header class="main-header">
        <div>
          <h1 class="text-2xl font-bold">Meu Dia</h1>
          <p class="text-muted" id="todayDate">--</p>
        </div>
        <div class="header-actions">
          <button class="btn-secondary" id="openSettings">⚙️ Configurações</button>
        </div>
      </header>

      <section class="content">
        <div class="col-left">
          <div class="card">
            <div class="card-head flex items-center justify-between">
              <strong>Minhas tarefas</strong>
              <button id="addTaskBtn" class="btn-primary-sm">+ Nova</button>
            </div>

            <ul id="taskList" class="task-list mt-4"></ul>
          </div>
        </div>

        <aside class="col-right">
          <div class="card">
            <strong>Sugestões</strong>
            <ul class="mt-3 text-sm text-muted list-disc list-inside">
              <li>Estudar para prova</li>
              <li>Preparar slides</li>
              <li>Revisar código</li>
            </ul>
          </div>
        </aside>
      </section>

      <footer class="page-footer text-muted mt-6 text-center">
        Versão protótipo — Front-end
      </footer>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-body card">
      <h3 id="modalTitle" class="text-lg font-semibold">Nova tarefa</h3>
      <label class="flex flex-col mt-2">
        <span class="text-sm text-muted">Título</span>
        <input id="modalTitleInput" class="input" />
      </label>

      <label class="flex flex-col mt-2">
        <span class="text-sm text-muted">Descrição</span>
        <textarea id="modalDesc" class="input" rows="3"></textarea>
      </label>

      <div class="mt-4 flex gap-2 justify-end">
        <button id="cancelModal" class="btn-secondary">Cancelar</button>
        <button id="saveModal" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Script principal -->
  <script src="app.js"></script>
</body>
</html>
