<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FocusFlow — Login</title>
<!-- Tailwind CDN (apenas utilitários) -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css">
</head>
<body class="page page-login">
<main class="min-h-screen flex items-center justify-center bg-page">
<div class="card w-full max-w-3xl grid md:grid-cols-2 gap-6 p-8">
<!-- Left: illustration + branding -->
<div class="hidden md:flex flex-col justify-center gap-6 px-4">
<div>
<h1 class="brand">FocusFlow</h1>
<p class="lead">Organize suas tarefas da faculdade de forma simples e elegante.</p>
</div>
<div class="illustration" aria-hidden>
<!-- simple SVG illustration -->
<svg viewBox="0 0 600 400" class="w-full h-auto" xmlns="http://www.w3.org/2000/svg">
<rect width="100%" height="100%" rx="12" fill="url(#g)" opacity="0.06" />
<defs>
<linearGradient id="g" x1="0" x2="1">
<stop offset="0" stop-color="#7c3aed"/>
<stop offset="1" stop-color="#06b6d4"/>
</linearGradient>
</defs>
</svg>
</div>
</div>


<!-- Right: form -->
<div class="px-2">
<h2 class="text-2xl font-extrabold">Entrar</h2>
<p class="text-muted mt-1 mb-6">Entre com seu e-mail para continuar.</p>


<form id="loginForm" class="flex flex-col gap-4">
<label class="flex flex-col">
<span class="text-sm text-muted">E-mail</span>
<input id="email" type="email" placeholder="seu@exemplo.com" required class="input" />
</label>


<label class="flex flex-col">
<span class="text-sm text-muted">Senha</span>
<input id="password" type="password" placeholder="••••••••" required class="input" />
</label>


<button type="submit" class="btn-primary mt-2">Entrar</button>


<div class="flex items-center gap-2 mt-2 text-sm text-muted">
<input id="remember" type="checkbox" /> <label for="remember">Lembrar de mim</label>
</div>


<div class="mt-4 text-sm text-muted">Ou continue sem conta — <a href="home.html" class="link">ver demonstração</a></div>
</form>


<footer class="mt-6 text-xs text-muted">Projeto de faculdade — front-end estático</footer>
</div>
</div>
</main>


<script src="app.js"></script>
</body>
</html>
